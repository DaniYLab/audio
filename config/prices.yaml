# Bảng giá mặc định (M2-8 / WORKPLAN_WIRING T1-DEV1).
# Dữ liệu — KHÔNG hardcode trong code. Điều chỉnh theo hóa đơn thật khi có.
# Tier = preset của (tts engine + image model + transcription engine), không
# phải logic code (m2_design §5.4).

# Giá mỗi 1K token (USD), per model.
llm:
  gpt-4o:            { input_per_1k: 0.0025, output_per_1k: 0.0100 }
  gpt-4o-mini:       { input_per_1k: 0.00015, output_per_1k: 0.0006 }
  glm-4.6:           { input_per_1k: 0.0006, output_per_1k: 0.0020 }   # ước lượng, điều chỉnh theo hóa đơn
  deepseek-chat:     { input_per_1k: 0.0003, output_per_1k: 0.0006 }   # ước lượng, điều chỉnh theo hóa đơn
  gemini-3.8-flash:  { input_per_1k: 0.0003, output_per_1k: 0.0012 }   # gateway llmgate — calibrate theo hóa đơn thật

# Giá mỗi 1K tokens (USD) cho embedding, per model.
embedding:
  text-embedding-3-small: { per_1k: 0.00002 }
  bge_m3_local:           { per_1k: 0.0 }   # chạy local — miễn phí

# Giá mỗi image (USD), per provider/model.
images:
  "fal-ai/flux/schnell":          { per_image: 0.003 }   # ước lượng, điều chỉnh theo hóa đơn
  "fal-ai/flux-pro/kontext":      { per_image: 0.050 }   # ước lượng, điều chỉnh theo hóa đơn
  "gpt-image-1":                  { per_image: 0.040 }
  "gpt-image-2":                  { per_image: 0.104 }   # chuẩn OpenAI medium 1536x1024 — calibrate gateway

# Giá mỗi 1K chars (USD), per TTS engine.
tts:
  edge:            { per_1k_chars: 0.0 }   # free
  elevenlabs:      { per_1k_chars: 0.300 } # ước lượng, điều chỉnh theo hóa đơn

# Giá mỗi phút audio (USD), per transcription engine.
stt:
  whisperx:        { per_minute: 0.0 }     # local — miễn phí
  assemblyai:      { per_minute: 0.003 }   # ước lượng, điều chỉnh theo hóa đơn

# Tier presets (m2_design §5.4): tts engine + image model + stt engine.
tiers:
  standard:
    tts: edge
    images: ["fal-ai/flux/schnell"]
    stt: whisperx
  premium:
    tts: elevenlabs
    images: ["fal-ai/flux-pro/kontext", "gpt-image-1"]
    stt: assemblyai
