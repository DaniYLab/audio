services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - sf_qdrant:/qdrant/storage

  storyforge:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: storyforge:latest
    depends_on:
      - qdrant
    environment:
      SF__KNOWLEDGE__QDRANT_URL: http://qdrant:6333
    # Workspace is a named volume so artifacts survive container restarts.
    volumes:
      - sf_workspace:/app/data
      # Mount secrets at runtime; never bake them into the image.
      - ../.env:/app/.env:ro
    env_file:
      - ../.env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  sf_workspace:
  sf_qdrant:
